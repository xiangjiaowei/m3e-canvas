name: Regen lock (temp)

on: workflow_dispatch

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - uses: actions/upload-artifact@v5
        with:
          name: package-lock
          path: package-lock.json